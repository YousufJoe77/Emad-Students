
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emad English | Homework Submission</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#f3f6fb;color:#172033;font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px}
    .wrap{width:min(100%,650px)}
    .brand{font-weight:800;letter-spacing:-1px;font-size:26px;margin-bottom:22px}
    .brand span{color:#536dfe}
    .card{background:white;border:1px solid #e5eaf3;border-radius:22px;padding:clamp(22px,5vw,40px);box-shadow:0 18px 60px #1c2a4410}
    .eyebrow{font-size:12px;font-weight:800;letter-spacing:1.5px;color:#536dfe;text-transform:uppercase}
    h1{font-size:clamp(27px,5vw,38px);letter-spacing:-1px;margin:10px 0}
    p{color:#68748a;line-height:1.6;margin-top:0}
    label{display:block;font-size:13px;font-weight:700;margin:19px 0 8px}
    input,select{width:100%;padding:14px 15px;border:1px solid #dce3ef;border-radius:11px;font:inherit;color:#172033;background:white;outline:none}
    input:focus,select:focus{border-color:#536dfe;box-shadow:0 0 0 3px #536dfe18}
    .drop{border:1.5px dashed #c8d2e4;border-radius:14px;padding:20px;background:#f9faff}
    .drop input{border:0;padding:8px 0;background:transparent}
    .hint{font-size:12px;color:#7a8598;margin-top:7px}
    button{width:100%;border:0;border-radius:11px;padding:15px;background:#536dfe;color:white;font:700 15px Arial,sans-serif;cursor:pointer;margin-top:22px}
    button:disabled{opacity:.6;cursor:wait}
    #status{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:13px;display:none;overflow-wrap:anywhere}
    #status.ok{display:block;background:#eafaf1;color:#147a45}
    #status.err{display:block;background:#fff0f0;color:#b42318}
    footer{text-align:center;color:#8791a3;font-size:12px;margin-top:18px}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">EMAD<span>.</span> ENGLISH</div>

    <section class="card">
      <div class="eyebrow">Student portal</div>
      <h1>Submit your homework.</h1>
      <p>Enter your details and upload your homework file. Please check your information before submitting.</p>

      <form id="homeworkForm">
        <label for="studentName">Full name</label>
        <input id="studentName" maxlength="120" autocomplete="name"
          placeholder="Enter your full name" required>

        <label for="stage">Your stage</label>
        <select id="stage" required>
          <option value="">Choose your stage</option>
          <option>2nd Preparatory</option>
          <option>3rd Preparatory</option>
          <option>1st Secondary</option>
          <option>2nd Secondary</option>
          <option>3rd Secondary</option>
        </select>

        <label for="homeworkFile">Homework file</label>
        <div class="drop">
          <input id="homeworkFile" type="file"
            accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.webp" required>
          <div class="hint">PDF, Word, or image files. Maximum size: 10 MB.</div>
        </div>

        <button id="submitBtn" type="submit">Submit homework</button>
      </form>

      <div id="status" role="status"></div>
    </section>

    <footer>Emad English · Homework submission portal</footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://qwljyziwookssiuxahfr.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_UEnx7UzAp3l2lCTXRqRmQg_ZolHqMGU";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("homeworkForm");
    const button = document.getElementById("submitBtn");
    const statusBox = document.getElementById("status");

    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = type;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const studentName = document.getElementById("studentName").value.trim();
      const stage = document.getElementById("stage").value;
      const file = document.getElementById("homeworkFile").files[0];

      if (!studentName || !stage || !file) return;

      const allowed = [
        "application/pdf",
        "application/msword",
        "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
        "image/jpeg",
        "image/png",
        "image/webp"
      ];

      if (file.size > 10 * 1024 * 1024) {
        return showStatus("The file is larger than 10 MB. Please choose a smaller file.", "err");
      }

      if (file.type && !allowed.includes(file.type)) {
        return showStatus("This file type is not supported. Upload a PDF, Word document, or image.", "err");
      }

      button.disabled = true;
      button.textContent = "Submitting...";
      statusBox.className = "";
      statusBox.style.display = "none";

      let path = "";

      try {
        if (!crypto.randomUUID) {
          throw new Error("Your browser does not support secure file upload. Please use an updated browser.");
        }

        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_").slice(-120);
        path = `${crypto.randomUUID()}/${Date.now()}-${safeName}`;

        const upload = await db.storage
          .from("homework")
          .upload(path, file, {
            upsert: false,
            contentType: file.type || "application/octet-stream"
          });

        if (upload.error) throw upload.error;

        const result = await db.rpc("submit_homework", {
          p_student_name: studentName,
          p_stage: stage,
          p_original_name: file.name,
          p_storage_path: path
        });

        if (result.error) {
          await db.storage.from("homework").remove([path]);
          throw result.error;
        }

        form.reset();
        showStatus("Homework submitted successfully. You can close this page now.", "ok");

      } catch (error) {
        console.error(error);
        showStatus(
          "Could not submit your homework. Please try again or contact your teacher. Details: " +
          (error.message || "Unknown error"),
          "err"
        );
      } finally {
        button.disabled = false;
        button.textContent = "Submit homework";
      }
    });
  </script>
</body>
</html>
